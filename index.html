<script>
const db = [
  { c:"銅板小吃", e:"🍜", d:"大腸蚵仔麵線", s:"昌平路大腸麵線", a:"昌平商圈", o:6.5, cl:13.5 },
  { c:"銅板小吃", e:"🍳", d:"招牌蚵仔煎", s:"台北蚵仔煎", a:"一點利市場", o:11, cl:21 },
  { c:"宵夜炸物", e:"🍗", d:"無骨鹽酥雞", s:"炸滋滋無骨鹽酥雞", a:"昌平商圈", o:16, cl:25 },
  { c:"台式熱炒", e:"🐓", d:"招牌甕缸雞", s:"東山棧甕缸雞", a:"大坑東山", o:11, cl:21.5 },
  { c:"日式料理", e:"🍣", d:"炙燒鮭魚肚", s:"藏壽司 文心崇德店", a:"文心崇德", o:11, cl:22 },
  { c:"火鍋燒肉", e:"🥩", d:"日本A5和牛", s:"屋馬燒肉 崇德店", a:"崇德商圈", o:11, cl:24 },
  { c:"韓式異國", e:"🌶️", d:"月亮蝦餅", s:"瓦城泰國料理 崇德店", a:"崇德商圈", o:11.5, cl:21.5 },
  { c:"義式美式", e:"🍝", d:"爆炸蛤蜊麵", s:"JAI宅 水湳店", a:"水湳商圈", o:11, cl:21.5 },
  { c:"早午餐甜點", e:"🥪", d:"粉漿蛋餅", s:"昌平路傳統早餐店", a:"昌平商圈", o:5.5, cl:12 },
  { c:"早午餐甜點", e:"🍡", d:"綜合芋圓冰", s:"大坑東東芋圓", a:"大坑東山", o:9, cl:22 }
];
let snd = true, ac = null;
function togSnd() { snd = !snd; document.getElementById("sbtn").innerText = snd ? "🔊 音效開" : "🔇 靜音"; }
function beep(f, t, dur, del) {
  if (!snd) return;
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
  if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t; o.frequency.setValueAtTime(f, ac.currentTime + del);
  g.gain.setValueAtTime(0.12, ac.currentTime + del); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + del + dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + del); o.stop(ac.currentTime + del + dur);
}
function isOp(s) {
  const n = new Date(), cur = n.getHours() + n.getMinutes() / 60;
  return s.cl > 24 ? (cur >= s.o || cur < s.cl - 24) : (cur >= s.o && cur < s.cl);
}
function clk() {
  const n = new Date();
  document.getElementById("clk").innerText = "🕒 " + (n.getHours()<10?"0":"") + n.getHours() + ":" + (n.getMinutes()<10?"0":"") + n.getMinutes();
}
setInterval(clk, 10000); clk();
function getL() {
  const v = document.getElementById("cat").value, k = document.getElementById("chk").checked, r = [];
  for (let i = 0; i < db.length; i++) if ((v === "all" || db[i].c === v) && (!k || isOp(db[i]))) r.push(db[i]);
  return r;
}
function updCnt() { document.getElementById("cnt").innerText = "符合：" + getL().length + " 家"; }
updCnt();
function roll(el, arr, fin, ms, sf, cb) {
  let h = "";
  for (let i = 0; i < arr.length; i++) h += '<div class="item">' + arr[i] + '</div>';
  h += '<div class="item">' + fin + '</div>';
  el.innerHTML = h; el.style.transition = "none"; el.style.transform = "translateY(0px)";
  const iv = setInterval(function() { beep(520, "triangle", 0.04, 0); }, 110);
  setTimeout(function() { el.style.transition = "transform " + ms + "ms cubic-bezier(0.15,0.85,0.25,1)"; el.style.transform = "translateY(" + (-(arr.length * 100)) + "px)"; }, 30);
  setTimeout(function() { clearInterval(iv); beep(sf, "sine", 0.15, 0); if (cb) cb(); }, ms + 40);
}
function go() {
  const l = getL();
  if (l.length === 0) { alert("目前該分類都在休息中喔！請取消勾選「僅抽營業中」試試！"); return; }
  const it = l[Math.floor(Math.random() * l.length)], op = isOp(it);
const b = document.getElementById("btn"), box = document.getElementById("res");
b.disabled = true; b.innerText = "轉動中..."; box.style.display = "none";
const a1 = [], a2 = [], a3 = [];
for (let i = 0; i < 12; i++) { const r = db[Math.floor(Math.random() * db.length)]; a1.push(r.e + "
" + r.d); }
for (let i = 0; i < 18; i++) { const r = db[Math.floor(Math.random() * db.length)]; a2.push("🏪
" + r.s); }
for (let i = 0; i < 24; i++) { a3.push(i % 2 === 0 ? "🟢
營業中" : "🔴
休息中"); }
roll(document.getElementById("st1"), a1, it.e + "
" + it.d, 1300, 392, null);
roll(document.getElementById("st2"), a2, "🏪
" + it.s, 1900, 494, null);
roll(document.getElementById("st3"), a3, op ? "🟢
營業中！" : "🔴
休息中", 2500, 587, function() {
b.disabled = false; b.innerText = "再轉一次！"; box.className = op ? "res" : "res off";
if (op) {
beep(523, "triangle", 0.25, 0); beep(659, "triangle", 0.25, 0.1); beep(784, "triangle", 0.35, 0.2);
document.getElementById("rt").innerText = "🎉 中獎！【" + it.a + "】" + it.s;
document.getElementById("ra").innerHTML = '<a class="map-btn" href="google.com' + encodeURIComponent("台中市北屯區 " + it.s) + '" target="_blank">📍 Google 地圖導航';
} else {
beep(311, "sawtooth", 0.25, 0); beep(246, "sawtooth", 0.35, 0.2);
document.getElementById("rt").innerText = "🔴 殘念休息中！【" + it.a + "】" + it.s;
document.getElementById("ra").innerHTML = '沒開門不算，再轉一次吧！';
}
document.getElementById("rh").innerText = "必點：" + it.d;
box.style.display = "block";
});
}
