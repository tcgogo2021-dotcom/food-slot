  .btn { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; font-weight: bold; color: #1a1a2e; background: #ffd700; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #b39700; }
  .btn:disabled { background: #888; box-shadow: none; color: #ccc; }
  .res { display: none; margin-top: 12px; background: rgba(255,255,255,0.12); border: 1.5px solid #ffd700; border-radius: 12px; padding: 12px; text-align: center; }
  .res.off { border-color: #ff6b6b; background: rgba(255,75,75,0.15); }
  .map-btn { display: inline-block; margin-top: 8px; background: #00b894; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; }

<script>
const shops = [
  { cat: "銅板小吃", dish: "大腸蚵仔麵線", shop: "昌平路大腸麵線", area: "昌平商圈", open: 6.5, close: 13.5 },
  { cat: "銅板小吃", dish: "招牌蚵仔煎", shop: "台北蚵仔煎", area: "一點利市場", open: 11, close: 21 },
  { cat: "宵夜炸物", dish: "無骨鹽酥雞", shop: "炸滋滋無骨鹽酥雞", area: "昌平商圈", open: 16, close: 25 },
  { cat: "台式熱炒", dish: "招牌甕缸雞", shop: "東山棧甕缸雞", area: "大坑東山", open: 11, close: 21.5 },
  { cat: "日式料理", dish: "炙燒鮭魚肚", shop: "藏壽司 文心崇德店", area: "文心崇德", open: 11, close: 22 },
  { cat: "火鍋燒肉", dish: "日本A5和牛", shop: "屋馬燒肉 崇德店", area: "崇德商圈", open: 11, close: 24 },
  { cat: "韓式異國", dish: "月亮蝦餅", shop: "瓦城泰國料理 崇德店", area: "崇德商圈", open: 11.5, close: 21.5 },
  { cat: "義式美式", dish: "爆炸蛤蜊麵", shop: "JAI宅 水湳店", area: "水湳商圈", open: 11, close: 21.5 },
  { cat: "早午餐甜點", dish: "粉漿蛋餅", shop: "昌平路傳統早餐店", area: "昌平商圈", open: 5.5, close: 12 },
  { cat: "早午餐甜點", dish: "綜合芋圓冰", shop: "大坑東東芋圓", area: "大坑東山", open: 9, close: 22 }
];
let snd = true, ac = null;
function togSnd() { snd = !snd; document.getElementById("sbtn").innerText = snd ? "🔊 音效開" : "🔇 靜音"; }
function beep(f, t, dur, del) {
  if (!snd) return;
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
  if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = t; o.frequency.setValueAtTime(f, ac.currentTime + del);
  g.gain.setValueAtTime(0.12, ac.currentTime + del); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + del + dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + del); o.stop(ac.currentTime + del + dur);
}
function isOp(s) {
  const n = new Date(), cur = n.getHours() + n.getMinutes() / 60;
  return s.cl > 24 ? (cur >= s.open || cur < s.close - 24) : (cur >= s.open && cur < s.close);
}
function clk() {
  const n = new Date();
  document.getElementById("clk").innerText = "🕒 " + (n.getHours()<10?"0":"") + n.getHours() + ":" + (n.getMinutes()<10?"0":"") + n.getMinutes();
}
setInterval(clk, 10000); clk();
function getL() {
  const c = document.getElementById("cat").value, k = document.getElementById("chk").checked, r = [];
  for (let i = 0; i < shops.length; i++) if ((c === "all" || shops[i].cat === c) && (!k || isOp(shops[i]))) r.push(shops[i]);
  return r;
}
function updCnt() { document.getElementById("cnt").innerText = "符合：" + getL().length + " 家店"; }
updCnt();
function spinV3() {
  const list = getL();
  if (list.length === 0) { alert("目前該分類都在休息中喔！請取消勾選「僅抽營業中」試試！"); return; }
  const item = list[Math.floor(Math.random() * list.length)];
  const open = isOp(item);
  const btn = document.getElementById("btn"), box = document.getElementById("res");
  btn.disabled = true; btn.innerText = "高速滾動中..."; box.style.display = "none";
  document.getElementById("b1").classList.add("rolling");
  document.getElementById("b2").classList.add("rolling");
  document.getElementById("b3").classList.add("rolling");
  let step = 0;
  const iv = setInterval(function() {
    step++;
    beep(520, "triangle", 0.04, 0);
    const r = shops[step % shops.length];
    if (step <= 12) document.getElementById("s1").innerText = r.dish;
if (step === 13) { document.getElementById("s1").innerText = item.dish; document.getElementById("b1").classList.remove("rolling"); beep(392, "sine", 0.15, 0); }
if (step <= 20) document.getElementById("s2").innerText = r.shop;
if (step === 21) { document.getElementById("s2").innerText = item.shop; document.getElementById("b2").classList.remove("rolling"); beep(494, "sine", 0.15, 0); }
if (step <= 28) document.getElementById("s3").innerText = (step % 2 === 0) ? "🟢 營業中" : "🔴 休息中";
if (step >= 29) {
clearInterval(iv);
document.getElementById("s3").innerText = open ? "🟢 營業中" : "🔴 休息中";
document.getElementById("b3").classList.remove("rolling");
beep(587, "sine", 0.15, 0);
btn.disabled = false; btn.innerText = "再轉一次！";
box.className = open ? "res" : "res off";
if (open) {
beep(523, "triangle", 0.25, 0.1); beep(659, "triangle", 0.25, 0.2); beep(784, "triangle", 0.35, 0.3);
document.getElementById("rt").innerText = "🎉 中獎！【" + item.area + "】" + item.shop;
document.getElementById("ra").innerHTML = '<a class="map-btn" href="google.com' + encodeURIComponent("台中市北屯區 " + item.shop) + '" target="_blank">📍 Google 地圖導航';
} else {
beep(311, "sawtooth", 0.25, 0.1); beep(246, "sawtooth", 0.35, 0.3);
document.getElementById("rt").innerText = "🔴 殘念休息中！【" + item.area + "】" + item.shop;
document.getElementById("ra").innerHTML = '沒開門不算，再轉一次吧！';
}
document.getElementById("rh").innerText = "必點：" + item.dish;
box.style.display = "block";
}
}, 85);
}
