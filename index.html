<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台中市北屯區・美食幸運拉霸機 v2.0</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
  body { margin: 0; padding: 12px 6px; background: linear-gradient(135deg, #141424 0%, #1a2238 100%); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .top-bar { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 6px; }
  .region-badge { background: #e94560; color: #fff; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; }
  .clock-badge { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,215,0,0.4); color: #ffe066; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
  .header { text-align: center; margin-bottom: 12px; }
  .header h1 { margin: 0; font-size: 20px; color: #ffd700; }
  .header p { margin: 4px 0 0; font-size: 12px; color: #b0b8d1; }
  .main-arena { display: flex; flex-direction: row; align-items: stretch; justify-content: center; gap: 6px; width: 100%; max-width: 960px; }
  .ad-column { flex: 0 0 21%; max-width: 175px; min-width: 72px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
  .ad-card { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.4); border-radius: 10px; padding: 6px 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: #fff; min-height: 72px; }
  .ad-card.vacant { border: 1px dashed rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); cursor: pointer; }
  .ad-tag { font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 6px; margin-bottom: 3px; background: #ffd700; color: #1a1a2e; }
  .ad-card.vacant .ad-tag { background: rgba(255,255,255,0.15); color: #bbb; }
  .ad-title { font-size: 11px; font-weight: bold; line-height: 1.2; margin-bottom: 2px; }
  .ad-sub { font-size: 9px; color: #ffe066; }
  .center-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .filter-panel { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 10px; width: 100%; margin-bottom: 10px; }
  select { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #fff; color: #1a1a2e; font-size: 13px; font-weight: bold; outline: none; }
  .open-row { margin-top: 8px; font-size: 12px; color: #ffe066; display: flex; justify-content: space-between; align-items: center; }
  .machine { background: #e94560; padding: 14px 8px; border-radius: 18px; width: 100%; border: 3px solid #ffd700; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .slots { display: flex; gap: 5px; background: #0f3460; padding: 10px 6px; border-radius: 10px; }
  .slot-box { flex: 1; background: #fff; color: #1a1a2e; border-radius: 8px; height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 4px; }
  .slot-label { font-size: 9px; color: #888; margin-bottom: 4px; font-weight: bold; }
  .slot-text { font-size: 13px; font-weight: 900; line-height: 1.2; }
  .btn-spin { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; font-weight: bold; color: #1a1a2e; background: #ffd700; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #b39700; }
  .result-card { display: none; margin-top: 12px; background: rgba(255,255,255,0.12); border: 1.5px solid #ffd700; border-radius: 12px; padding: 12px; width: 100%; text-align: center; }
  .result-card.closed { border-color: #ff6b6b; background: rgba(255,75,75,0.15); }
  .btn-map { display: inline-block; margin-top: 8px; background: #00b894; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>
<div class="top-bar">
  <span class="region-badge">📍 台中市・北屯區 v2.0</span>
  <span class="clock-badge" id="liveClock">🕒 --:--</span>
</div>
<div class="header">
  <h1>🎰 北屯區美食幸運拉霸機</h1>
  <p>加入料理分類與即時對時營業狀態判定</p>
</div>
<div class="main-arena">
  <div class="ad-column">
    <a class="ad-card" href="https://google.com" target="_blank"><span class="ad-tag">VIP 1</span><div class="ad-title">屋馬燒肉 崇德</div><div class="ad-sub">訂位贈私房菜</div></a>
    <a class="ad-card" href="https://google.com" target="_blank"><span class="ad-tag">VIP 2</span><div class="ad-title">藏壽司 崇德</div><div class="ad-sub">滿額抽限定扭蛋</div></a>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 3</span><div class="ad-title">北屯創始席位</div><div class="ad-sub">點擊洽談合作</div></div>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 4</span><div class="ad-title">北屯美食席位</div><div class="ad-sub">高精準在地導流</div></div>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 5</span><div class="ad-title">商圈特約席位</div><div class="ad-sub">歡迎名店進駐</div></div>
  </div>
  <div class="center-stage">
    <div class="filter-panel">
      <select id="catSelect" onchange="updateCount()">
        <option value="all">🎲 全部料理隨機抽</option>
        <option value="銅板小吃">🥢 銅板小吃</option>
        <option value="宵夜炸物">🍗 宵夜炸物</option>
        <option value="台式熱炒">🇹🇼 台式熱炒</option>
        <option value="日式料理">🇯🇵 日式料理</option>
        <option value="火鍋燒肉">🍲 火鍋燒肉</option>
        <option value="韓式異國">🇰🇷 韓式異國</option>
        <option value="義式美式">🇮🇹 義式美式</option>
        <option value="早午餐甜點">🧋 早午餐甜點</option>
      </select>
      <div class="open-row">
        <label><input type="checkbox" id="openCheck" onchange="updateCount()"> 🟢 僅抽營業中</label>
        <span id="countText">統計中...</span>
      </div>
    </div>
    <div class="machine">
      <div class="slots">
        <div class="slot-box"><div class="slot-label">第一軸・菜色</div><div class="slot-text" id="s1">❓</div></div>
        <div class="slot-box"><div class="slot-label">第二軸・店家</div><div class="slot-text" id="s2">❓</div></div>
        <div class="slot-box"><div class="slot-label">第三軸・狀態</div><div class="slot-text" id="s3">❓</div></div>
      </div>
      <button class="btn-spin" onclick="spinV2()">北屯美食，開轉！</button>
    </div>
    <div class="result-card" id="resBox">
      <div id="resText" style="font-weight:bold;font-size:14px;"></div>
      <div id="resHours" style="font-size:12px;color:#ccc;margin-top:4px;"></div>
      <div id="resAction"></div>
    </div>
  </div>
  <div class="ad-column">
    <a class="ad-card" href="https://google.com" target="_blank"><span class="ad-tag">VIP 6</span><div class="ad-title">丰禾台味 崇德</div><div class="ad-sub">王品台菜名店</div></a>
    <a class="ad-card" href="https://google.com" target="_blank"><span class="ad-tag">VIP 7</span><div class="ad-title">JAI宅 水湳店</div><div class="ad-sub">爆炸蛤蜊義大利麵</div></a>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 8</span><div class="ad-title">北屯創始席位</div><div class="ad-sub">一鍵導航吸客</div></div>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 9</span><div class="ad-title">限量廣告席位</div><div class="ad-sub">全區限量 10 席</div></div>
    <div class="ad-card vacant" onclick="alert('北屯黃金廣告位招租中！')"><span class="ad-tag">招租 10</span><div class="ad-title">特約合作席位</div><div class="ad-sub">了解合作方案</div></div>
  </div>
</div>
<script>
const shopsV2 = [
  { cat: "銅板小吃", dish: "大腸蚵仔麵線", shop: "昌平路大腸麵線", area: "昌平商圈", open: 6.5, close: 13.5 },
  { cat: "銅板小吃", dish: "招牌蚵仔煎", shop: "台北蚵仔煎", area: "一點利市場", open: 11, close: 21 },
  { cat: "宵夜炸物", dish: "無骨鹽酥雞", shop: "炸滋滋無骨鹽酥雞", area: "昌平商圈", open: 16, close: 25 },
  { cat: "台式熱炒", dish: "招牌甕缸雞", shop: "東山棧甕缸雞", area: "大坑東山", open: 11, close: 21.5 },
  { cat: "日式料理", dish: "炙燒鮭魚肚", shop: "藏壽司 文心崇德店", area: "文心崇德", open: 11, close: 22 },
  { cat: "火鍋燒肉", dish: "日本A5和牛", shop: "屋馬燒肉 崇德店", area: "崇德商圈", open: 11, close: 24 },
  { cat: "韓式異國", dish: "月亮蝦餅", shop: "瓦城泰國料理 崇德店", area: "崇德商圈", open: 11.5, close: 21.5 },
  { cat: "義式美式", dish: "爆炸蛤蜊麵", shop: "JAI宅 水湳店", area: "水湳商圈", open: 11, close: 21.5 },
  { cat: "早午餐甜點", dish: "粉漿蛋餅", shop: "昌平路傳統早餐店", area: "昌平商圈", open: 5.5, close: 12 },
  { cat: "早午餐甜點", dish: "綜合芋圓冰", shop: "大坑東東芋圓", area: "大坑東山", open: 9, close: 22 }
];
function isOpenNow(s) {
  const now = new Date();
  const cur = now.getHours() + now.getMinutes() / 60;
  if (s.close > 24) return cur >= s.open || cur < (s.close - 24);
  return cur >= s.open && cur < s.close;
}
function updateClock() {
  const n = new Date();
  const hh = n.getHours() < 10 ? "0" + n.getHours() : "" + n.getHours();
  const mm = n.getMinutes() < 10 ? "0" + n.getMinutes() : "" + n.getMinutes();
  document.getElementById("liveClock").innerText = "🕒 " + hh + ":" + mm;
}
setInterval(updateClock, 10000); updateClock();

function getList() {
  const c = document.getElementById("catSelect").value;
  const only = document.getElementById("openCheck").checked;
  const res = [];
  for (let i = 0; i < shopsV2.length; i++) {
    const s = shopsV2[i];
    if ((c === "all" || s.cat === c) && (!only || isOpenNow(s))) {
      res.push(s);
    }
  }
  return res;
}
function updateCount() {
  document.getElementById("countText").innerText = "符合：" + getList().length + " 家店";
}
updateCount();

function spinV2() {
  const list = getList();
  if (list.length === 0) { alert("目前該分類都在休息中喔！請取消勾選「僅抽營業中」試試！"); return; }
  const idx = Math.floor(Math.random() * list.length);
  const item = list[idx];
  const open = isOpenNow(item);
  document.getElementById("s1").innerText = item.dish;
  document.getElementById("s2").innerText = item.shop;
  document.getElementById("s3").innerText = open ? "🟢 營業中" : "🔴 休息中";
  const box = document.getElementById("resBox");
  box.className = open ? "result-card" : "result-card closed";
  document.getElementById("resText").innerText = (open ? "🎉 中獎！【" : "🔴 殘念休息中！【") + item.area + "】" + item.shop;
  document.getElementById("resHours").innerText = "必點：" + item.dish;
  document.getElementById("resAction").innerHTML = open
    ? '<a class="btn-map" href="https://google.com' + encodeURIComponent("台中市北屯區 " + item.shop) + '" target="_blank">📍 Google 地圖導航</a>'
    : '<div style="margin-top:6px;color:#ff7675;font-size:12px;">沒開門不算，再轉一次吧！</div>';
  box.style.display = "block";
}
</script>
</body>
</html>
