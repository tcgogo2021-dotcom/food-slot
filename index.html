<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台中市北屯區・百大美食幸運拉霸機</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
  body { margin: 0; padding: 12px 6px; background: linear-gradient(135deg, #141424 0%, #1a2238 100%); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
  .top-bar { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 6px; }
  .region-badge { background: linear-gradient(90deg, #ff6b6b, #e94560); color: #fff; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; box-shadow: 0 2px 8px rgba(233, 69, 96, 0.4); }
  .clock-badge { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,215,0,0.4); color: #ffe066; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
  .sound-toggle { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .header { text-align: center; margin-bottom: 12px; }
  .header h1 { margin: 0; font-size: 21px; color: #ffd700; text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4); }
  .header p { margin: 3px 0 0; font-size: 12px; color: #b0b8d1; }

  .main-arena { display: flex; flex-direction: row; align-items: stretch; justify-content: center; gap: 6px; width: 100%; max-width: 960px; }
  .ad-column { flex: 0 0 21%; max-width: 175px; min-width: 72px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
  .ad-card { flex: 1; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 215, 0, 0.35); border-radius: 10px; padding: 6px 4px; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: #fff; transition: transform 0.15s; min-height: 76px; }
  .ad-card:active { transform: scale(0.96); }
  .ad-card.vacant { border: 1px dashed rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.03); }
  .ad-tag { display: inline-block; font-size: 9px; font-weight: bold; padding: 1px 5px; border-radius: 6px; margin-bottom: 3px; background: #ffd700; color: #1a1a2e; }
  .ad-card.vacant .ad-tag { background: rgba(255, 255, 255, 0.15); color: #bbb; }
  .ad-title { font-size: 11px; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 2px; word-break: break-all; }
  .ad-sub { font-size: 9px; color: #ffe066; line-height: 1.15; }
  .ad-card.vacant .ad-sub { color: #999; }

  .center-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .filter-panel { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 14px; padding: 10px; width: 100%; margin-bottom: 10px; }
  .filter-panel label.title-lbl { display: block; font-size: 11px; color: #ffd700; margin-bottom: 5px; font-weight: bold; }
  select { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #fff; color: #1a1a2e; font-size: 13px; font-weight: bold; outline: none; cursor: pointer; }
  .open-only-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 12px; color: #ffe066; }
  .open-only-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: bold; }
  .open-only-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #00b894; cursor: pointer; }
  .stats-line { font-size: 10px; color: #a0a8c0; margin-top: 5px; text-align: right; }

  .machine { background: #e94560; padding: 12px 8px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4); width: 100%; border: 3px solid #ffd700; }
  .machine.win-glow { animation: winPulse 0.6s ease-in-out 3; }
  @keyframes winPulse { 0%, 100% { box-shadow: 0 0 15px #ffd700; } 50% { box-shadow: 0 0 38px #fff, 0 0 55px #ffd700; } }

  .slots { display: flex; gap: 4px; background: #0f3460; padding: 8px 5px; border-radius: 10px; border: 2px solid #1a1a2e; }
  .slot-window { flex: 1; background: #fff; color: #1a1a2e; border-radius: 7px; height: 112px; position: relative; overflow: hidden; box-shadow: inset 0 10px 12px -6px rgba(0,0,0,0.4), inset 0 -10px 12px -6px rgba(0,0,0,0.4); }
  .slot-label { font-size: 9px; color: #fff; background: rgba(15,52,96,0.9); padding: 1px 6px; border-radius: 6px; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-weight: bold; z-index: 5; white-space: nowrap; }
  .reel-strip { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
  .reel-item { height: 112px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 18px 3px 4px; font-weight: 900; line-height: 1.2; word-break: break-word; color: #1a1a2e; }
  .reel-emoji { font-size: 20px; margin-bottom: 3px; }
  .reel-text { font-size: 12px; }

  .btn-spin { width: 100%; margin-top: 12px; padding: 13px 8px; font-size: 16px; font-weight: bold; color: #1a1a2e; background: linear-gradient(to bottom, #ffe066, #ffd700); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #b39700, 0 6px 14px rgba(0,0,0,0.3); }
  .btn-spin:active { transform: translateY(3px); box-shadow: 0 1px 0 #b39700; }
  .btn-spin:disabled { background: #888; box-shadow: none; color: #ccc; }

  .result-card { display: none; margin-top: 12px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,215,0,0.6); border-radius: 14px; padding: 14px; width: 100%; text-align: center; animation: fadeIn 0.35s ease; }
  .result-card.closed-card { border-color: #ff6b6b; background: rgba(255, 75, 75, 0.12); }
  .status-pill { display: inline-block; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; }
  .status-open { background: #00b894; color: #fff; }
  .status-closed { background: #d63031; color: #fff; }
  .result-card h3 { margin: 0 0 6px; color: #ffd700; font-size: 16px; }
  .result-card.closed-card h3 { color: #ff7675; }
  .result-card .meta { font-size: 12px; color: #d0d8f0; margin-bottom: 8px; }
  .dish-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 12px; }
  .dish-tag { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 12px; font-size: 11px; color: #fff; }
  .dish-tag.highlight { background: #ffd700; color: #1a1a2e; font-weight: bold; border-color: #ffd700; }
  .btn-map { display: inline-block; background: #00b894; color: #fff; text-decoration: none; padding: 9px 18px; border-radius: 25px; font-weight: bold; font-size: 13px; }
  .btn-retry { display: inline-block; background: #e17055; color: #fff; border: none; padding: 9px 18px; border-radius: 25px; font-weight: bold; font-size: 13px; cursor: pointer; }

  .footer-biz { margin-top: 18px; text-align: center; font-size: 11px; color: #8c96b5; }
  .footer-biz span { color: #ffd700; text-decoration: underline; cursor: pointer; }
  #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="top-bar">
  <span class="region-badge">📍 北屯百大美食旗艦站</span>

</div>

<div class="header">
